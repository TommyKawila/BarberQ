<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>ClipperQ Demo — Booking success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Capture mode: kill all motion so we never shoot mid-animation */
    *, *::before, *::after {
      animation: none !important;
      animation-duration: 0s !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 390px;
      height: 844px;
      overflow: hidden;
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      background: #000;
      color: #fafafa;
      -webkit-font-smoothing: antialiased;
    }
    .phone {
      width: 390px;
      height: 844px;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }
    .topbar .close {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #d4d4d8;
      font-size: 22px;
      line-height: 1;
      font-weight: 300;
    }
    .topbar .title {
      font-size: 15px;
      font-weight: 600;
      color: #f4f4f5;
      letter-spacing: -0.01em;
    }
    .body {
      flex: 1;
      min-height: 0;
      padding: 4px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .hero {
      position: relative;
      height: 200px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-top: 2px;
      overflow: hidden;
    }
    /* Soft spotlight only — glow centered below top edge so no hard trapezoid cut */
    .soft-beam {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      height: 78%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(
        ellipse 52% 58% at 50% 22%,
        rgba(251, 191, 36, 0.40) 0%,
        rgba(251, 191, 36, 0.18) 34%,
        rgba(251, 191, 36, 0.05) 62%,
        transparent 82%
      );
      filter: blur(3px);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 100%);
    }
    .hero-glow {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: 62%;
      height: 34px;
      border-radius: 100%;
      background: rgba(251, 191, 36, 0.22);
      filter: blur(16px);
      pointer-events: none;
      z-index: 0;
    }
    .hero img.chair {
      position: relative;
      z-index: 1;
      width: 178px;
      height: auto;
      /* Hide baked hard lamp at top of asset */
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        transparent 14%,
        rgba(0, 0, 0, 0.35) 20%,
        black 30%,
        black 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        transparent 14%,
        rgba(0, 0, 0, 0.35) 20%,
        black 30%,
        black 100%
      );
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.55));
    }
    /* Exactly one settled check badge — no animation (asset hole is transparent) */
    .check-badge {
      position: absolute;
      z-index: 3;
      right: 88px;
      bottom: 52px;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background: #22c55e;
      border: 2.5px solid #fbbf24;
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .check-badge svg {
      width: 22px;
      height: 22px;
    }
    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 2px;
      line-height: 1.25;
      flex-shrink: 0;
    }
    .card {
      margin-top: 10px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 16px;
      background: #141414;
      padding: 12px 14px 10px;
      flex-shrink: 0;
    }
    .date {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #e4e4e7;
    }
    .time {
      text-align: center;
      margin-top: 2px;
      font-size: 38px;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .duration {
      text-align: center;
      margin-top: 2px;
      font-size: 12px;
      color: #a1a1aa;
    }
    .divider {
      margin: 9px 0;
      border: 0;
      border-top: 1px solid #27272a;
    }
    .who {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .who img {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      object-fit: cover;
      border: 2px solid #fbbf24;
      background: #18181b;
      flex-shrink: 0;
    }
    .who-name {
      font-size: 16px;
      font-weight: 700;
      color: #fafafa;
      line-height: 1.2;
    }
    .who-shop {
      margin-top: 2px;
      font-size: 13px;
      color: #a1a1aa;
    }
    .next-label {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #71717a;
      font-weight: 500;
      flex-shrink: 0;
    }
    .steps {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      color: #e4e4e7;
      line-height: 1.35;
    }
    .step .dot {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step .dot.done { background: #22c55e; }
    .step .dot.todo {
      border: 1.5px solid #52525b;
      background: transparent;
    }
    .step .dot.done svg { width: 11px; height: 11px; }
    .footer {
      margin-top: auto;
      padding-top: 10px;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-radius: 999px;
      background: #fbbf24;
      color: #18181b;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }
    .back {
      margin-top: 14px;
      margin-bottom: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      color: #fafafa;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="phone" data-capture-ready="pending">
    <header class="topbar">
      <span class="close" aria-hidden="true">×</span>
      <div class="title">ClipperQ Demo</div>
    </header>
    <div class="body">
      <div class="hero">
        <div class="soft-beam" aria-hidden="true"></div>
        <div class="hero-glow" aria-hidden="true"></div>
        <img
          class="chair"
          src="/sale/booking-success-chair-capture.png"
          alt=""
          width="178"
          height="178"
          decoding="sync"
          loading="eager"
        />
        <div class="check-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
      </div>
      <h1>จองคิวสำเร็จ!</h1>

      <section class="card">
        <div class="date">ศุกร์ 16 ต.ค. 2026</div>
        <div class="time">11:30</div>
        <div class="duration">60 นาที · เสร็จประมาณ 12:30</div>
        <hr class="divider" />
        <div class="who">
          <img src="/sale/booking-success-barber.webp" alt="ช่างนัท" width="46" height="46" decoding="sync" loading="eager" />
          <div>
            <div class="who-name">ช่างนัท</div>
            <div class="who-shop">ClipperQ Demo</div>
          </div>
        </div>
      </section>

      <div class="next-label">ขั้นตอนต่อไป</div>
      <div class="steps">
        <div class="step">
          <span class="dot done">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          <span>จองคิวแล้ว</span>
        </div>
        <div class="step">
          <span class="dot done">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          <span>ส่งข้อความยืนยันทาง LINE แล้ว</span>
        </div>
        <div class="step">
          <span class="dot todo"></span>
          <span>แจ้งเตือนทาง LINE ก่อนถึงเวลานัด</span>
        </div>
        <div class="step">
          <span class="dot todo"></span>
          <span>เจอกันที่ร้าน ClipperQ Demo</span>
        </div>
      </div>

      <div class="footer">
        <a class="cta" href="#">ดูคิวของฉัน</a>
        <div class="back">กลับหน้าร้าน</div>
      </div>
    </div>
  </div>
  <script>
    // Mark ready only after fonts, images, and two animation frames settle.
    (async function () {
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
      } catch (_) {}
      const imgs = Array.from(document.images);
      await Promise.all(imgs.map((img) => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise((resolve) => {
          img.addEventListener("load", resolve, { once: true });
          img.addEventListener("error", resolve, { once: true });
        });
      }));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // Extra settle time for any late paints / decoded frames
      await new Promise((r) => setTimeout(r, 800));
      document.querySelector(".phone").dataset.captureReady = "1";
    })();
  </script>
</body>
</html>
