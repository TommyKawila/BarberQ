<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="ClipperQ cover">
  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2622"/>
      <stop offset="40%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ink)"/>
  <!-- Three diagonal amber stripes at -37°, right side, opacities 0.9 / 0.35 / 0.15 -->
  <g transform="rotate(-37 1280 450)">
    <rect x="980" y="280" width="720" height="36" fill="#F6AD34" fill-opacity="0.9"/>
    <rect x="1000" y="360" width="720" height="36" fill="#F6AD34" fill-opacity="0.35"/>
    <rect x="1020" y="440" width="720" height="36" fill="#F6AD34" fill-opacity="0.15"/>
  </g>
</svg>
