name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # LayoutProps/PageProps are generated into .next/types (Next.js 16).
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      # TODO(P0 lint baseline): 29 errors are mostly react-hooks/set-state-in-effect
      # in existing auth/admin UI hooks (+ 1 impure-render in QuickBlockGrid).
      # Fixing them needs intentional React refactors, not drive-by edits.
      # Lint runs for visibility but does not fail the job yet.
      # Make this step blocking once the baseline is cleared.
      # scripts/** is ignored in eslint.config.mjs (CommonJS ops utilities).
      - name: Lint (non-blocking — known baseline)
        run: npm run lint
        continue-on-error: true

      - name: Test security
        run: npm run test:security

      - name: Test shop
        run: npm run test:shop

      - name: Test booking
        run: npm run test:booking

      - name: Test onboarding
        run: npm run test:onboarding

      # Production build asserts required env; use safe placeholders only (no real secrets).
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_LIFF_ID: "0000000000-placeholder"
          NEXT_PUBLIC_APP_URL: https://example.com
          SUPERADMIN_TOKEN: ci-placeholder-superadmin-token
        run: npm run build
