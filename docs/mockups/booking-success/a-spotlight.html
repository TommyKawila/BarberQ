<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Mockup A — Spotlight stage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 390px; height: 844px; overflow: hidden;
      font-family: "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
      background: #09090b; color: #fafafa;
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      width: 390px; height: 844px;
      padding: 28px 20px 24px;
      display: flex; flex-direction: column; gap: 18px;
      background:
        radial-gradient(ellipse 80% 40% at 50% 8%, rgba(251,191,36,0.10), transparent 60%),
        #09090b;
    }
    .hero {
      position: relative;
      height: 220px;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .beam {
      position: absolute; top: 0; left: 22%; right: 22%; height: 70%;
      background: linear-gradient(to bottom, rgba(251,191,36,0.32), rgba(251,191,36,0.08) 45%, transparent);
      clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
      filter: blur(0.5px);
      pointer-events: none;
    }
    .glow {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: 58%; height: 40px; border-radius: 100%;
      background: rgba(251,191,36,0.22); filter: blur(18px);
    }
    .hero img {
      position: relative; z-index: 1;
      width: 188px; height: auto;
      filter: drop-shadow(0 14px 28px rgba(0,0,0,0.55));
    }
    .sparkle {
      position: absolute; z-index: 2; width: 6px; height: 6px;
      background: #fde68a; transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(253,230,138,0.9);
    }
    .s1 { left: 24%; top: 22%; }
    .s2 { right: 26%; top: 38%; width: 4px; height: 4px; background: #fff; }
    .s3 { left: 58%; top: 14%; width: 5px; height: 5px; }
    h1 {
      text-align: center; font-size: 26px; font-weight: 700;
      letter-spacing: -0.02em; line-height: 1.25;
    }
    .sub {
      text-align: center; font-size: 13px; line-height: 1.5; color: #d4d4d8; margin-top: -8px;
    }
    .see { text-align: center; font-size: 13px; color: #71717a; margin-top: -10px; }
    .card {
      border: 1px solid rgba(245,158,11,0.22);
      background: rgba(24,24,27,0.92);
      border-radius: 16px; padding: 16px;
      box-shadow: inset 0 1px 0 rgba(251,191,36,0.08);
    }
    .row {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    }
    .label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: #71717a;
    }
    .shop { font-size: 14px; font-weight: 600; }
    .who {
      display: flex; align-items: center; gap: 12px;
      margin-top: 12px; padding-top: 12px; border-top: 1px solid #27272a;
    }
    .who .avatar-slot {
      width: 56px; height: 56px; border-radius: 999px; flex-shrink: 0;
      background: #3f3f46; border: 1px solid #52525b;
      display: flex; align-items: center; justify-content: center;
      padding: 4px; text-align: center;
      font-size: 7px; font-weight: 600; line-height: 1.15; color: #e4e4e7;
    }
    .who-name { font-size: 16px; font-weight: 600; }
    .when {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid #27272a;
    }
    .date { margin-top: 4px; font-size: 14px; color: #d4d4d8; }
    .time {
      margin-top: 4px; font-size: 32px; font-weight: 700;
      color: #fcd34d; letter-spacing: -0.03em;
    }
    .mins { margin-top: 2px; font-size: 13px; color: #71717a; }
    .hint {
      margin-top: 12px; font-size: 13px; line-height: 1.45; color: #a1a1aa;
    }
    .cta {
      margin-top: auto;
      display: flex; align-items: center; justify-content: center;
      height: 48px; border-radius: 12px;
      background: #fbbf24; color: #09090b;
      font-size: 16px; font-weight: 700; text-decoration: none;
    }
    .sec {
      text-align: center; font-size: 13px; color: #a1a1aa;
      text-decoration: underline; text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="hero">
      <div class="beam" aria-hidden="true"></div>
      <div class="glow" aria-hidden="true"></div>
      <span class="sparkle s1" aria-hidden="true"></span>
      <span class="sparkle s2" aria-hidden="true"></span>
      <span class="sparkle s3" aria-hidden="true"></span>
      <img src="./assets/chair-spotlight.png" alt="" />
    </div>
    <h1>จองคิวสำเร็จแล้ว!</h1>
    <p class="sub">คิวของคุณถูกบันทึกเรียบร้อย — ไม่ต้องทำอะไรเพิ่ม</p>
    <p class="see">แล้วเจอกันที่ร้านนะครับ</p>

    <section class="card">
      <div class="row">
        <span class="label">ร้าน</span>
        <span class="shop">BarberQx Demo</span>
      </div>
      <div class="who">
        <div class="avatar-slot" title="/sale/booking-success-barber.webp" role="img" aria-label="รูปโปรไฟล์ช่างหน้าจองสำเร็จ 1:1 512×512">รูปโปรไฟล์ช่าง<br/>1:1 · 512×512<br/>/sale/…</div>
        <div>
          <div class="label">ช่าง</div>
          <div class="who-name">ช่างนัท</div>
        </div>
      </div>
      <div class="when">
        <div class="label">วันเวลา</div>
        <div class="date">ศุกร์ 16 ตุลาคม 2026</div>
        <div class="time">11:30</div>
        <div class="mins">60 นาที</div>
      </div>
      <p class="hint">ระบบจะส่งข้อความยืนยันและเตือนคิวใน LINE ให้คุณ</p>
    </section>

    <a class="cta" href="#">ดูคิวของฉัน</a>
    <p class="sec">กลับหน้าร้าน</p>
  </div>
</body>
</html>
